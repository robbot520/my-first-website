영국 잉글랜드의 최상위 프로 축구 리그.

같은 이름을 가진 다른 국가의 축구 리그들[3]과는 달리 축구 종주국으로서 국가명을 따로 붙이지 않기에 정식 명칭이 'Premier League', 약칭은 'PL'이다.[4]

2026년 기준 전세계 프로스포츠 리그 중 북미 스포츠 리그를 제외하고 수익 1위 리그이자, 전세계 축구 리그 중 수익 1위 리그이며,# 2025-2026 시즌 기준 UEFA 계수 1위 리그이다.</p>
